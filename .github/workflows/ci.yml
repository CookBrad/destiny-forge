name: CI

on:
  pull_request:
  push:
    branches: [develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings -A dead_code"

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --locked --bin destiny_forge
