[package]
name = "destiny_forge"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "A pixel farming and dungeon-crawling game with Monster Hunter-style forging"

[dependencies]
bevy = { version = "0.15", features = ["mp3", "wav"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
ron = "0.8"
directories = "5"
